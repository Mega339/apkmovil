name: apkmovil
description: "Aplicación Móvil del Sistema de Trámite Documentario (SIS TRÁMITE)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_spinkit: ^5.2.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.4
  package_info_plus: ^8.0.0
  ota_update: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "imagen/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - imagen/logo.png
